[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-mobile"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typesafe-sdk>=0.7.2",
]

[project.scripts]
jev-mobile = "jev_mobile.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
